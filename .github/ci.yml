name: Build APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Setup SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true
      - name: Gen keystore
        run: keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CI,O=CI,C=CN" 2>/dev/null || true
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android app/build/outputs/apk/release/app-release.apk debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
